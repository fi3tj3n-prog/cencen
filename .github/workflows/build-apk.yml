name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Salin aplikasi web ke APK
        run: cp index.html icon.svg android/app/src/main/assets/
      - name: Build
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon
      - name: Siapkan file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cencen.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cencen-apk
          path: cencen.apk
      - name: Terbitkan rilis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete terbaru -y --cleanup-tag || true
          gh release create terbaru cencen.apk --title "Cencen APK terbaru" --notes "Unduh cencen.apk lalu pasang di HP Android."
